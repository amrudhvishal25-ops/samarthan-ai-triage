# Fly.io — Samarthan WhatsApp bot worker.
# Deploy:  fly launch --no-deploy   (creates the app, pick a name/region)
# then:    fly volume create wa_auth --size 1 --region <same region>
# then:    fly secrets set DATABASE_URL=... OPENAI_API_KEY=... NEXT_PUBLIC_APP_URL=https://samarthan-ai.vercel.app
# then:    fly deploy

app = "samarthan-whatsapp-bot"
primary_region = "sin"          # Singapore — closest to India; change if you like

[build]
  dockerfile = "Dockerfile"

[env]
  PORT = "8080"

# One always-on machine. auto_stop off so the WhatsApp socket never drops.
[[services]]
  internal_port = 8080
  protocol = "tcp"
  auto_stop_machines = false
  auto_start_machines = false
  min_machines_running = 1

  [[services.ports]]
    port = 80
    handlers = ["http"]

  [[services.ports]]
    port = 443
    handlers = ["tls", "http"]

  [services.concurrency]
    type = "connections"
    hard_limit = 25
    soft_limit = 20

  [[services.http_checks]]
    interval = "30s"
    timeout = "5s"
    grace_period = "20s"
    method = "get"
    path = "/health"

[[vm]]
  size = "shared-cpu-1x"
  memory = "256mb"

# Keep exactly one machine running at all times.
[deploy]
  strategy = "immediate"

[mounts]
  source = "wa_auth"
  destination = "/app/.whatsapp_auth"
